---
# ClearSignage as a Home Assistant app (Epic 119 Pass 4).
#
# Every field below that is not boilerplate is a decision made in the epic, and the
# comments say which one — because the interesting half of this file is what it does
# *not* ask for.
name: ClearSignage
# Bumped so the Supervisor actually fetches a new image. It tracks the installed app by
# this version, so republishing the same tag leaves an existing install on the bytes it
# already has — a rebuild alone is not something Home Assistant goes looking for.
version: "0.1.911"
slug: clearsignage
description: >-
  Run one or more ClearSignage screens inside Home Assistant. Each screen is a complete,
  independent signage player with its own content library, managed on itself.
url: https://github.com/WorkPlain-com/ClearSignage-HA
# A prebuilt image, not a local build. The Supervisor can build an app on the user's own
# machine, and for a public add-on that is friendlier — but this image is built from a
# *private* repository, so a local build would need ClearSignage credentials to exist on
# every customer's Home Assistant. Publishing keeps the source private, turns a ten-minute
# compile on a CM4 into a pull, and means every install runs the bytes that were tested.
#
# One multi-arch manifest, deliberately without the `{arch}` placeholder: that form is
# deprecated, and a manifest list lets the Supervisor pull the right layer itself.
#
# The registry is private. Home Assistant stores per-registry credentials of its own
# (Supervisor's `docker/registries` API), so ghcr.io read access is configured once per
# install and never appears in this file.
image: ghcr.io/workplain-com/clearsignage-ha
# HA Yellow is a CM4 (aarch64); amd64 covers a NUC or a VM. 32-bit Arm is deliberately
# absent — HA OS dropped it, and the device dependency pins are resolved against
# manylinux aarch64/x86_64 wheels (see ClearSignage's `make device-lock`).
arch:
  - aarch64
  - amd64

# The Supervisor terminates ingress and hands the app an authenticated operator. This is
# the entry path that carries authority (DP64), and the only one that does.
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: ClearSignage
# Admin-only: the panel leads to screens that can be reconfigured, and DP64 treats an
# authenticated Home Assistant user as the authority for a live-state write.
panel_admin: true

# Required, not merely convenient (DP65). A hosted screen is a full LAN peer: it answers
# UDP 9876 discovery, is reached by peers at <host-ip>:810N for /sync/*, and publishes a
# .local name (DP66). None of that is expressible through port mapping, because peers
# address the *host*, not a container port.
#
# The consequence is stated here rather than discovered later: with host_network the
# instance ports are directly reachable on the LAN, so that path deliberately carries no
# authority — see DP64 and the negative tests in ClearSignage's test_hosted_platform.py.
host_network: true

# The host's avahi publishes each screen's <name>.local (DP66). Home Assistant OS already
# owns 5353 — it is what answers homeassistant.local — so the app talks to that daemon
# over D-Bus rather than running a second one that would contend for the port and lose.
host_dbus: true

# /data is mounted persistently for every app without being asked for, and it is the only
# storage this app uses: /data/instances.json is the fleet, /data/instances/<n>/ is one
# screen's whole world. No `map:` entry, because the app has no business in Home
# Assistant's configuration, its SSL certificates, or its media.

startup: application
boot: auto
# The HA base images run s6-overlay as init; Docker's own would fight it.
init: false

# The fleet page answering is the honest liveness signal: it is served by the supervisor,
# and a supervisor that cannot serve it cannot start or proxy a screen either.
watchdog: "http://[HOST]:[PORT:8099]/"

options:
  # Empty means "work it out at start-up from the default route". Stated explicitly when
  # a host has several addresses and the wrong one would have every screen advertise an
  # endpoint that resolves nowhere useful (DP65).
  host_ip: ""
  # The shared port every <name>.local answers on (DP66). 80 so a typed URL has no port
  # in it, which is the whole point of publishing a name — and configurable because it is
  # the one thing here that can collide with another app on the host (an NGINX proxy,
  # most obviously).
  vhost_port: 80
  log_level: info

schema:
  host_ip: "str?"
  vhost_port: "port"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
